{% extends "froshims_layout.html" %}

{% block body %}

  <h1>Register</h1>
  <form action="/register" method="post">
    <input autocomplete="off" autofocus name="name" placeholder="Name" type="text">
    {% for sport in sports %}
    <input type="radio" value="{{ sport }}" id="{{sport}}-radio" name="sport">
    <label for="{{sport}}-radio">{{ sport}}</label>
    {% endfor %}
    <button type="submit">Register</button>
  </form>

{% endblock %}
